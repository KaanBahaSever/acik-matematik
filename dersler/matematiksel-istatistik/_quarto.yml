project:
  type: book

metadata-files:
  - ../../_kitap-ortak.yml

book:
  title: "Matematiksel İstatistik"
  reader-mode: true
  bread-crumbs: false
  sidebar:
    style: floating
    collapse-level: 1

  # Every exercise carries its own solution inside its box; the tables page
  # is the last chapter so that every chapter can link to it.
  chapters:
    - file: index.qmd
    - part: "Özel Dağılımlar"
      chapters:
        - bernoulli-binom-ve-cok-terimli.qmd
        - hipergeometrik-geometrik-ve-negatif-binom.qmd
        - poisson-ve-kesikli-duzgun.qmd
        - onemli-surekli-dagilimlar.qmd
        - normal-dagilim.qmd
    - part: "Örnekleme ve Limit Teoremleri"
      chapters:
        - istatistige-giris.qmd
        - orneklem-ve-istatistikler.qmd
        - yakinsama-ve-merkezi-limit-teoremi.qmd
    - part: "Nokta Tahmini"
      chapters:
        - momentler-yontemi.qmd
        - en-cok-olabilirlik-yontemi.qmd
        - tahmin-edicilerin-ozellikleri.qmd
    - part: "Aralık Tahmini ve Testler"
      chapters:
        - orneklem-dagilimlari.qmd
        - ortalama-icin-aralik-tahmini.qmd
        - varyans-ve-iki-kitle-icin-aralik-tahmini.qmd
        - oran-icin-aralik-tahmini.qmd
        - hipotez-testlerine-giris.qmd
    - alistirmalar.qmd
    - tablolar.qmd
