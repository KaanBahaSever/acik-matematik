<!-- ===========================================================================
     Light/dark theme switch.

     Quarto's own colour-scheme control is a single icon-only button that shows
     a small toggle (slider) glyph; readers could not tell what it did or which
     theme was on. This replaces every such button with a labelled two-option
     switch, "Açık" (light) and "Koyu" (dark), with the active option filled.

     The original button is kept in the DOM (hidden), because Quarto's script
     looks it up to update its state; the new buttons call Quarto's own
     window.quartoToggleColorScheme(), so the choice is stored and restored
     exactly as before. A button only toggles when its theme is not already on.

     Pulled in by every book through _kitap-ortak.yml (include-after-body) and
     by the portal through the root _quarto.yml. Styles: "THEME SWITCH" in
     styles/global.css.
     =========================================================================== -->
<script>
(function () {
  "use strict";

  var SUN = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
    '<circle cx="8" cy="8" r="3.2" fill="currentColor"/>' +
    '<g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' +
    '<path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13' +
    'M3.05 12.95l1.13-1.13M11.82 4.18l1.13-1.13"/></g></svg>';
  var MOON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
    '<path fill="currentColor" d="M10.9 11.6A5.6 5.6 0 0 1 6.1 2.1a5.9 5.9 0 1 0 7.8 7.8 5.6 5.6 0 0 1-3 1.7z"/></svg>';

  function isDark() {
    return document.body.classList.contains("quarto-dark");
  }

  function sync() {
    var dark = isDark();
    document.querySelectorAll(".theme-switch-btn").forEach(function (b) {
      var on = (b.getAttribute("data-mode") === "dark") === dark;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function makeSwitch() {
    var wrap = document.createElement("div");
    wrap.className = "theme-switch";
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", "Renk teması");
    [["light", "Açık", SUN, "Açık tema"], ["dark", "Koyu", MOON, "Koyu tema"]].forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "theme-switch-btn";
      b.setAttribute("data-mode", o[0]);
      b.setAttribute("title", o[3]);
      b.innerHTML = o[2] + '<span class="theme-switch-label">' + o[1] + "</span>";
      b.addEventListener("click", function () {
        if ((o[0] === "dark") !== isDark() && typeof window.quartoToggleColorScheme === "function") {
          window.quartoToggleColorScheme();
        }
        sync();
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function init() {
    var toggles = document.querySelectorAll("a.quarto-color-scheme-toggle");
    if (!toggles.length) return;
    toggles.forEach(function (t) {
      if (t.nextElementSibling && t.nextElementSibling.classList.contains("theme-switch")) return;
      t.classList.add("theme-switch-replaced");
      t.setAttribute("aria-hidden", "true");
      t.setAttribute("tabindex", "-1");
      t.parentNode.insertBefore(makeSwitch(), t.nextSibling);
    });
    sync();
    // Quarto may change the theme by itself (stored choice, other tabs).
    new MutationObserver(sync).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
