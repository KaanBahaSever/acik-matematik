name: Derle ve Cloudflare Pages'e yayınla

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı anda tek bir yayın işi çalışsın; art arda gelen push'larda
# yarıda kalanlar iptal edilmesin (yayın bütünlüğü için).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Siteyi derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Quarto kur
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürümleri yazdır
        run: |
          quarto --version
          python3 --version

      - name: Tüm siteyi derle
        run: python3 scripts/build.py

      - name: Derleme çıktısını doğrula
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html üretilmedi"; exit 1; }
          test -f _site/dersler/index.html || { echo "::error::ders kataloğu üretilmedi"; exit 1; }
          echo "Üretilen HTML sayfa sayısı: $(find _site -name '*.html' | wc -l)"
          echo "Toplam boyut: $(du -sh _site | cut -f1)"

      - name: Çıktıyı arşivle
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Cloudflare Pages'e yayınla
    needs: build
    runs-on: ubuntu-latest
    # Fork'lardan gelen PR'lar gizli anahtarlara erişemez; deneyip hata vermesin.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Derlenmiş siteyi indir
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Cloudflare Pages'e gönder
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'acik-matematik' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Yayın adresini özetle
        run: |
          echo "### 🌿 Yayınlandı" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.cloudflare.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
