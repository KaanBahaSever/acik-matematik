name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per ref. A deployment of main must never be cut in half,
# but a pull-request build that a newer push has superseded is safe to cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    # Building and deploying happen on the same machine, so they are one job:
    # splitting them meant pushing the whole _site directory to GitHub as an
    # artifact and pulling it straight back down again.
    runs-on: [self-hosted, Windows, X64] # BAHA-PC Windows Runner'a yönlendirildi
    # This repository is public and the runner is a personal machine, so a fork's
    # pull request must never execute code on it. Forks cannot read the Cloudflare
    # secrets either, so such a run could not have deployed anything anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Runs are serialised, so a hung build would block every later deployment.
    timeout-minutes: 120
    defaults:
      run:
        # The "bash" on this runner's PATH is the WSL app-execution alias under
        # WindowsApps. It reads the Windows-style path of the temporary .sh file
        # the runner writes as an escape sequence and fails with "No such file or
        # directory", so point every run step straight at Git Bash instead. The
        # first step below checks that it is really there.
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      # Also put Git Bash ahead of the WSL alias on PATH, for any action that
      # shells out to bash on its own.
      - name: Make Git Bash the bash on PATH
        shell: powershell
        run: |
          $gitBin = 'C:\Program Files\Git\bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) {
            throw "Git Bash is missing from $gitBin. Install Git for Windows on the runner, or correct the shell path in .github/workflows/deploy.yml."
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check out the repository
        uses: actions/checkout@v7

      # Quarto ve Python kurulum adımları yok; sistemde kurulu sürümler kullanılır.
      - name: Print tool versions
        run: |
          for tool in quarto python node; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on the runner's PATH"; exit 1; }
          done
          echo "bash    $(which bash)"
          echo "quarto  $(quarto --version)"
          echo "python  $(python --version)"
          echo "node    $(node --version)"

      # Checked before the build so a missing secret fails in seconds instead of
      # after the full render.
      - name: Check the deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::the CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::the CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

      - name: Build the whole site
        run: python scripts/build.py

      - name: Verify the build output
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html was not produced"; exit 1; }
          test -f _site/dersler/index.html || { echo "::error::the course catalog was not produced"; exit 1; }
          count() { find _site -name "$1" | wc -l | tr -d '[:space:]'; }
          pages=$(count '*.html'); pdf=$(count '*.pdf'); epub=$(count '*.epub'); docx=$(count '*.docx')
          test "$pdf" -gt 0 || { echo "::error::no PDF was produced (scripts/export.py)"; exit 1; }
          for manifest in dersler/*/_downloads.json; do
            test -e "$manifest" || continue
            course="_site/dersler/$(basename "$(dirname "$manifest")")"
            ls "$course"/*.pdf >/dev/null 2>&1 || { echo "::error::$course has a download manifest but no PDF"; exit 1; }
          done
          echo "HTML pages: $pages"
          echo "Downloadable files: $pdf PDF, $epub EPUB, $docx DOCX"
          {
            echo "### 📚 Built"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| HTML pages | $pages |"
            echo "| Downloads | $pdf PDF, $epub EPUB, $docx DOCX |"
            echo "| Total size | $(du -sh _site | cut -f1) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'acik-matematik' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarize the deployment
        run: |
          {
            echo "### 🌿 Deployed"
            echo
            echo "Deployment: ${{ steps.cloudflare.outputs.deployment-url }}"
            echo "Production: https://acik-matematik.com"
          } >> "$GITHUB_STEP_SUMMARY"
