name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run at a time per ref. A deployment of main must never be cut in half,
# but a pull-request build that a newer push has superseded is safe to cancel.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    # Building and deploying happen on the same machine, so they are one job:
    # splitting them meant pushing the whole _site directory to GitHub as an
    # artifact and pulling it straight back down again.
    runs-on: [self-hosted, Windows, X64] # BAHA-PC Windows Runner'a yönlendirildi
    # This repository is public and the runner is a personal machine, so a fork's
    # pull request must never execute code on it. Forks cannot read the Cloudflare
    # secrets either, so such a run could not have deployed anything anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Runs are serialised, so a hung build would block every later deployment.
    timeout-minutes: 120
    defaults:
      run:
        # Windows PowerShell, not bash. "bash" on this runner's PATH is the WSL
        # app-execution alias under WindowsApps, which reads the Windows-style
        # path of the runner's temporary script as an escape sequence and dies
        # with "No such file or directory"; and a custom `shell:` cannot point
        # at Git Bash either, because the runner splits that string at the first
        # space and "C:\Program" is not a command. PowerShell 5.1 always ships
        # with Windows, so nothing has to be installed or ordered on PATH.
        shell: powershell
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Quarto ve Python kurulum adımları yok; sistemde kurulu sürümler kullanılır.
      - name: Print tool versions
        run: |
          foreach ($tool in 'quarto', 'python', 'node') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $found) {
              Write-Output "::error::$tool is not on the runner's PATH"
              exit 1
            }
            Write-Output ("{0,-8}{1}" -f $tool, $found.Source)
          }
          quarto --version
          python --version
          node --version

      # Checked before the build so a missing secret fails in seconds instead of
      # after the full render.
      - name: Check the deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          foreach ($name in 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              Write-Output "::error::the $name secret is not set"
              exit 1
            }
          }
          Write-Output "Both Cloudflare secrets are present."

      - name: Build the whole site
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the build output
        run: |
          foreach ($required in '_site\index.html', '_site\dersler\index.html') {
            if (-not (Test-Path -LiteralPath $required)) {
              Write-Output "::error::$required was not produced"
              exit 1
            }
          }

          $files = @(Get-ChildItem -LiteralPath '_site' -Recurse -File)
          $count = { param($ext) @($files | Where-Object { $_.Extension -eq $ext }).Count }
          $pages = & $count '.html'
          $pdf   = & $count '.pdf'
          $epub  = & $count '.epub'

          if ($pdf -eq 0) {
            Write-Output "::error::no PDF was produced (scripts/export.py)"
            exit 1
          }

          # Every course that advertises downloads must actually ship them.
          foreach ($course in Get-ChildItem -LiteralPath 'dersler' -Directory) {
            if (-not (Test-Path -LiteralPath (Join-Path $course.FullName '_downloads.json'))) { continue }
            $published = Join-Path '_site\dersler' $course.Name
            $shipped = @(Get-ChildItem -LiteralPath $published -Filter '*.pdf' -File -ErrorAction SilentlyContinue)
            if ($shipped.Count -eq 0) {
              Write-Output "::error::$published has a download manifest but no PDF"
              exit 1
            }
          }

          $size = '{0:N0} MB' -f [math]::Round((($files | Measure-Object -Property Length -Sum).Sum) / 1MB)
          Write-Output "HTML pages: $pages"
          Write-Output "Downloadable files: $pdf PDF, $epub EPUB"
          Write-Output "Total size: $size"

          $summary = @(
            '### Built'
            ''
            '| | |'
            '|---|---|'
            "| HTML pages | $pages |"
            "| Downloads | $pdf PDF, $epub EPUB |"
            "| Total size | $size |"
            ''
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary + "`n", (New-Object System.Text.UTF8Encoding $false))

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'acik-matematik' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarize the deployment
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          $summary = @(
            '### Deployed'
            ''
            "Deployment: $env:DEPLOYMENT_URL"
            'Production: https://acik-matematik.com'
            ''
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary + "`n", (New-Object System.Text.UTF8Encoding $false))
