name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; do not cancel a run that is already in
# progress when pushes arrive back to back (keeps deployments consistent).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build the site
    runs-on: [self-hosted, Windows, X64] # BAHA-PC Windows Runner'a yönlendirildi
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print tool versions
        shell: bash # Windows'ta Bash komutlarının çalışması için eklendi
        run: |
          quarto --version
          python --version

      - name: Build the whole site
        shell: bash
        run: python scripts/build.py

      - name: Verify the build output
        shell: bash # Linux komutlarının (find, wc, test vb.) Windows'ta hata vermemesi için kritik
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html was not produced"; exit 1; }
          test -f _site/dersler/index.html || { echo "::error::the course catalog was not produced"; exit 1; }
          echo "HTML pages: $(find _site -name '*.html' | wc -l)"
          echo "Downloadable files: $(find _site -name '*.pdf' | wc -l) PDF, $(find _site -name '*.epub' | wc -l) EPUB, $(find _site -name '*.docx' | wc -l) DOCX"
          test "$(find _site -name '*.pdf' | wc -l)" -gt 0 || { echo "::error::no PDF was produced (scripts/export.py)"; exit 1; }
          for m in dersler/*/_downloads.json; do
            d="_site/dersler/$(basename "$(dirname "$m")")"
            ls "$d"/*.pdf >/dev/null 2>&1 || { echo "::error::$d has a download manifest but no PDF"; exit 1; }
          done
          echo "Total size: $(du -sh _site | cut -f1)"

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: [self-hosted, Windows, X64] # Deploy adımı da yerel makinede yapılacak
    # Pull requests from forks cannot read the secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'acik-matematik' }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarize the deployment
        shell: bash
        run: |
          echo "### 🌿 Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment: ${{ steps.cloudflare.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "Production: https://acik-matematik.com" >> $GITHUB_STEP_SUMMARY