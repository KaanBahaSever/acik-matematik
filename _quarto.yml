project:
  type: website
  output-dir: _site

  # Every course is an independent Quarto "book" project rendered separately
  # by scripts/build.py. The root project only produces the portal pages
  # (home page + course catalog).
  render:
    - index.qmd
    - dersler/index.qmd
    # Analiz and Soyut Cebir are four books each (dersler/analiz-1 .. 4,
    # dersler/soyut-cebir-1 .. 4); their hub pages belong to no book, so the
    # portal project renders them.
    - dersler/analiz/index.qmd
    - dersler/soyut-cebir/index.qmd

website:
  title: "Açık Matematik"
  description: "Lisans matematik derslerinden derlenmiş, açık kaynaklı ve reklamsız Türkçe not arşivi."
  # favicon.svg is a simplified cut of assets/logo.svg drawn for 16-32 px
  # (wider book, thicker stem, no text lines); the PNG fallbacks for
  # Safari/iOS are linked from format.html.include-in-header below.
  favicon: assets/favicon.svg
  site-url: https://acik-matematik.com

  navbar:
    # The logo and the title are two links to the home page; the alt text
    # names that link, since a link holding only an image needs one.
    # The mark has no tile, so the dark theme gets its own variant (lighter
    # greens, softer page colour).
    logo:
      light:
        path: assets/logo.svg
        alt: "Açık Matematik ana sayfası"
      dark:
        path: assets/logo-dark.svg
        alt: "Açık Matematik ana sayfası"
    title: "Açık Matematik"
    left:
      - href: dersler/index.qmd
        text: "Dersler"
    right:
      - icon: github
        href: https://github.com/KaanBahaSever/acik-matematik
        aria-label: "GitHub deposu"

  page-footer:
    center: |
      Akademik amaçlarla hazırlanmış açık kaynaklı eğitim arşivi.
      İçerikler [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.tr) ile lisanslanmıştır — ticari amaçla kullanılamaz.

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles/global.css
    toc: false
    # Icons for browsers that ignore the SVG favicon: Safari before 26 and the
    # iOS home screen. Quarto turns the "/" paths into page-relative ones.
    # Kept as a list so a page's own include-in-header (index.qmd) is added
    # to it instead of replacing it.
    include-in-header:
      - text: |
          <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
          <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

lang: tr
