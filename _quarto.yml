project:
  type: website
  output-dir: _site

  # Her ders kendi başına bağımsız bir Quarto "book" projesidir ve
  # scripts/build.py tarafından ayrıca derlenir. Kök site yalnızca
  # portal sayfalarını (ana sayfa + ders kataloğu) üretir.
  render:
    - index.qmd
    - dersler/index.qmd

website:
  title: "🌿 Açık Matematik"
  description: "Lisans matematik derslerinden derlenmiş, açık kaynaklı ve reklamsız Türkçe not arşivi."
  favicon: assets/favicon2.svg
  site-url: https://acikmatematik.pages.dev

  navbar:
    left:
      - href: index.qmd
        text: "Ana Sayfa"
      - href: dersler/index.qmd
        text: "Ders Kataloğu"
    right:
      - icon: github
        href: https://github.com/KaanBahaSever/math-notebook
        aria-label: "GitHub deposu"

  page-footer:
    center: |
      Akademik amaçlarla hazırlanmış açık kaynaklı eğitim arşivi.
      İçerikler [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.tr) ile lisanslanmıştır — ticari amaçla kullanılamaz.

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - styles/global.css
    toc: false

lang: tr
