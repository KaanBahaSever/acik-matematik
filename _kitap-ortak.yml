# ============================================================================
# Quarto settings shared by every course book.
#
# Each course (dersler/<course>/_quarto.yml) pulls this file in with:
#
#     metadata-files:
#       - ../../_kitap-ortak.yml
#
# So the theme, typography, Turkish theorem/definition labels and the global
# CSS are managed in one place.
# ============================================================================

# A link back to the course catalog at the top of every book's sidebar.
# Books are published under /dersler/<course>/, so the catalog is addressed
# root-relatively; the link works from any depth inside the book.
book:
  # Same tab icon as the portal pages. The file lives under assets/ in the
  # repository root; book projects are rendered from dersler/<course>/ and
  # their output is copied to _site/dersler/<course>/, so two levels up is
  # exactly the _site root.
  favicon: ../../assets/favicon2.svg

  sidebar:
    header: |
      <a class="catalog-back" href="/../">← Tüm Dersler</a>

# collapsible.lua strips emoji from callout titles and turns the collapsible
# "Çözüm" (solution) / "İspat" (proof) blocks into <details> elements. It
# runs in the "pre-quarto" stage, i.e. before Quarto converts callouts into
# its own components.
#
# The next three filters serve the downloadable files (PDF/EPUB/DOCX,
# scripts/export.py): export_figures.lua turns the SVG drawings embedded as
# raw HTML into real figures, export_math.lua fixes the \tag and vmatrix
# constructs that do not convert to Typst, and downloads.lua adds the
# download panel to the curriculum page. In the web (HTML) build the first
# two do nothing.
filters:
  - ../../scripts/collapsible.lua
  - ../../scripts/export_figures.lua
  - ../../scripts/export_math.lua
  - ../../scripts/downloads.lua

format:
  html:
    fontsize: 1.1em
    # Line spacing: 1.2 was too tight for text full of formulas; inline math
    # raises the line height, so a more generous value is needed.
    linestretch: 1.65
    page-layout: article
    callout-appearance: default
    callout-icon: true
    toc: true
    toc-title: "Bu Sayfada"
    toc-depth: 3
    toc-location: right
    number-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css:
      - ../../styles/global.css

lang: tr

# Turkish titles for Quarto's crossref environments (theorem, definition, example, …)
language:
  crossref-thm-title: "Teorem"
  crossref-thm-prefix: "Teorem"
  crossref-lem-title: "Lemma"
  crossref-lem-prefix: "Lemma"
  crossref-cor-title: "Sonuç"
  crossref-cor-prefix: "Sonuç"
  crossref-prp-title: "Önerme"
  crossref-prp-prefix: "Önerme"
  crossref-cnj-title: "Sanı"
  crossref-cnj-prefix: "Sanı"
  crossref-def-title: "Tanım"
  crossref-def-prefix: "Tanım"
  crossref-exm-title: "Örnek"
  crossref-exm-prefix: "Örnek"
  crossref-exr-title: "Alıştırma"
  crossref-exr-prefix: "Alıştırma"
  crossref-rem-title: "Not"
  crossref-rem-prefix: "Not"
  crossref-fig-title: "Şekil"
  crossref-fig-prefix: "Şekil"
  crossref-tbl-title: "Tablo"
  crossref-tbl-prefix: "Tablo"
  crossref-eq-prefix: "Denklem"
  crossref-ch-prefix: "Bölüm"
  crossref-sec-prefix: "Bölüm"
  crossref-prf-title: "İspat"
  crossref-sol-title: "Çözüm"
  section-title-footnotes: "Dipnotlar"
  callout-tip-title: "İpucu"
  callout-note-title: "Not"
  callout-warning-title: "Uyarı"
  callout-important-title: "Önemli"
  callout-caution-title: "Dikkat"
